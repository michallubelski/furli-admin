# Concurrent catalog import uploads per client address (see the import location below).
limit_conn_zone $binary_remote_addr zone=furli_catalog_import:1m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security response headers - see furli-fronted/docker/nginx.conf for the full rationale this
    # mirrors (script-src with no 'unsafe-inline'/'unsafe-eval', style-src allowing inline for
    # React's style={{...}} usage, connect-src 'self' only).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Same scanner-blocking rules as furli-fronted/docker/nginx.conf - kept here too since this
    # container's nginx is what runs if it's ever reached directly.
    location ~* \.env { return 444; }
    location ~ /\.git { return 444; }
    location ~ /\.aws/ { return 444; }
    location ~* \.(bak|backup|sql|swp|old)$ { return 444; }
    location ~* /(deploy\.sh|config\.inc\.php|wp-config\.php.*|phpinfo.*|php-info.*|info\.php.*|info\.txt)$ { return 444; }
    location ~ /vendor/ { return 444; }
    location ~ /WEB-INF/ { return 444; }

    # The catalog import (furli-backend's POST /api/admin/search/products/import, ADMIN only - the
    # backend checks the token before reading the body) takes one export chunk of ~11 MB, above
    # nginx's 1 MB default: only this exact path accepts it - POST alone, up to 64 MB streamed to the
    # backend as it arrives (never buffered to disk), at most 2 uploads at a time per client
    # address, 5 minutes to index. A stopgap until the import reads the file from storage.
    location = /api/admin/search/products/import {
        limit_except POST { deny all; }
        limit_conn furli_catalog_import 2;
        limit_conn_status 429;
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_pass http://furli-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://furli-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
